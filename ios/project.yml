name: Hallwise
options:
  bundleIdPrefix: com.eric2612115
  deploymentTarget:
    iOS: "26.0"
targets:
  Hallwise:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Hallwise
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Hallwise listens to the conversations you have, to remember who you met and what you promised.
        NSMotionUsageDescription: Hallwise uses the badge's orientation to keep everyone's position steady while you turn.
        NSLocalNetworkUsageDescription: Hallwise streams audio to your Hallwise server on this network.
        NSCameraUsageDescription: One photo of the people you are talking to, so each card gets a face.
        NSPhotoLibraryUsageDescription: Pick a photo of the people you are talking to, so each card gets a face.
        NSLocationWhenInUseUsageDescription: Hallwise notes where a recording happened, so an evening is filed under its venue.
        NSCalendarsFullAccessUsageDescription: Hallwise reads your calendar so the times it proposes for follow-ups don't collide with what you already have.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - target: HallwiseBadge
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eric2612115.hallwise
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
  HallwiseBadge:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Sources/BadgeActivity.swift
      - Sources/Theme.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Hallwise Badge
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eric2612115.hallwise.badge
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
