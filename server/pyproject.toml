[project]
name = "hallwise"
version = "0.1.0"
description = "Hallwise server: live audio ingest, Meta speech and language models, event log."
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "numpy>=2",
    "soxr>=0.4",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hallwise"]
